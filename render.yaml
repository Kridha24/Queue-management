services:
  - type: web
    name: queueflow-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queueflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: queueflow-redis
          property: connectionString
      - key: AES_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: redis
    name: queueflow-redis
    plan: free
    ipAllowList: []

databases:
  - name: queueflow-db
    plan: free
    databaseName: queueflow
    user: queueflow_user
