services:
  - type: web
    name: queueflow-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queueflow-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: queueflow-db
    plan: free
    databaseName: queueflow
    user: queueflow_user
