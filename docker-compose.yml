services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2

  api-1:
    build: .
    environment:
      - INSTANCE_ID=api-replica-1
      - DATABASE_URL=postgresql://queueflow_user:queueflow_pass@postgres:5432/queueflow
      - REDIS_URL=redis://redis:6379/0
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY:-change-me-in-production-32-chars}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      - postgres
      - redis

  api-2:
    build: .
    environment:
      - INSTANCE_ID=api-replica-2
      - DATABASE_URL=postgresql://queueflow_user:queueflow_pass@postgres:5432/queueflow
      - REDIS_URL=redis://redis:6379/0
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY:-change-me-in-production-32-chars}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=queueflow
      - POSTGRES_USER=queueflow_user
      - POSTGRES_PASSWORD=queueflow_pass
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
